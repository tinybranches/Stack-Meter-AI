name: AIBar
options:
  bundleIdPrefix: com.stackmeter
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CURRENT_PROJECT_VERSION: 15
    MARKETING_VERSION: "1.6.8"
schemes:
  AIBar:
    build:
      targets:
        AIBar: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
  Package:
    build:
      targets:
        AIBar: all
    run:
      config: Release

targets:
  AIBar:
    type: application
    platform: macOS
    sources:
      - path: AIBar
        excludes:
          - Resources/**
    resources:
      # Must live under AIBar/ — XcodeGen ignores Branding/*.xcassets for this target.
      - path: AIBar/Assets.xcassets
    postBuildScripts:
      - name: Ensure AppIcon.icns + Assets.car
        basedOnDependencyAnalysis: false
        script: |
          set -e
          DEST="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}"
          mkdir -p "$DEST"
          SRC="${SRCROOT}/Branding/AppIcon.icns"
          if [[ ! -f "$SRC" ]]; then
            SRC="${SRCROOT}/AIBar/Resources/AppIcon.icns"
          fi
          cp "$SRC" "$DEST/AppIcon.icns"
          echo "Embedded AppIcon.icns -> $DEST/AppIcon.icns"
          # Notifications / System Settings read the compiled App Icon from Assets.car.
          if [[ ! -f "$DEST/Assets.car" ]]; then
            echo "error: Assets.car missing — AppIcon asset catalog did not compile" >&2
            ls -la "$DEST" >&2 || true
            exit 1
          fi
          echo "Assets.car OK ($(wc -c < "$DEST/Assets.car") bytes)"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.stackmeter.ai
        PRODUCT_NAME: Stack Meter AI
        INFOPLIST_FILE: AIBar/Info.plist
        GENERATE_INFOPLIST_FILE: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        COMBINE_HIDPI_IMAGES: true
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"
        SWIFT_EMIT_LOC_STRINGS: YES
        ENABLE_HARDENED_RUNTIME: YES
    entitlements:
      path: AIBar/AIBar.entitlements
